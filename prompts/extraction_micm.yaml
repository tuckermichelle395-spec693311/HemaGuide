# MICM Extraction Prompts
# Converts Chinese MICM diagnostic reports into HemaGuide's standard
# tumor-board case fields so downstream routing/decision code can stay unchanged.

sections:
  - age
  - ECOG
  - main_diagnosis
  - secondary_diagnoses
  - predictive_factors
  - history
  - question
  - decision

system_prompt: |
  你是血液肿瘤 MICM 综合诊断报告的信息抽取助手。
  你的任务是从中文 MICM 报告中识别形态学、免疫学/流式、细胞遗传学、分子生物学结果，
  并把它们映射到 HemaGuide 需要的标准肿瘤委员会病例字段。

  严格规则：
  1. 只根据原文抽取和归纳，不要编造年龄、ECOG、治疗史或合并症。
  2. 如果报告中没有某项信息，字段值必须写 "nicht vorhanden"。
  3. 如果报告已经包含流式、核型、融合基因或分子检测结果，必须明确写入 history 或 predictive_factors，
     不要把这些已完成检查当成“仍需完成的下一步检查”。
  4. 输出必须是合法 JSON 对象，且只包含指定字段。
  5. 所有字段值必须是字符串。

section_prompts:
  age: "抽取患者年龄。若原文没有年龄，返回 'nicht vorhanden'。"
  ECOG: "抽取 ECOG 体能状态。若原文没有 ECOG，返回 'nicht vorhanden'。"
  main_diagnosis: "归纳主要诊断。必须整合形态学诊断、t(8;21)/RUNX1-RUNX1T1、AML-M2b 或核心结合因子 AML 等关键信息。不要只复制'建议结合其他检查'。"
  secondary_diagnoses: "抽取合并诊断或重要临床背景。若原文没有，返回 'nicht vorhanden'。"
  predictive_factors: "归纳预后/预测因素和关键遗传学结果，包括融合基因、核型、KIT/FLT3/NPM1/CEBPA 等突变状态、MRD 可用标志物。"
  history: "用简洁中文汇总已完成 MICM 检查：形态学、免疫学/流式、细胞遗传学、分子生物学。必须保留关键数值和阳性/阴性结果。"
  question: "根据报告自动生成肿瘤委员会问题：基于已完成 MICM 检查，评估诊断、危险分层、MRD 监测标志物和初始治疗建议。"
  decision: "如果原文已有明确会议决定或治疗建议则抽取；如果只是检验报告、没有治疗会议决定，返回 'nicht vorhanden'。不要把'建议结合临床/免疫/染色体/融合基因检查'当作治疗决定。"

template:
  header: '请从以下 MICM 综合诊断报告中抽取并归纳 HemaGuide 标准字段：'
  footer_instructions:
    - '返回 JSON 对象，键必须且只能为：{section_keys}'
    - '所有值必须为字符串。'
    - '缺失信息必须写 "nicht vorhanden"。'
    - '如果流式、核型、融合基因或分子检测已经在原文中出现，必须在 history/predictive_factors 中体现其已完成。'

json_schema:
  name: medical_sections
  strict: true
  schema:
    type: object
    properties:
      age:
        type: string
      ECOG:
        type: string
      main_diagnosis:
        type: string
      secondary_diagnoses:
        type: string
      predictive_factors:
        type: string
      history:
        type: string
      question:
        type: string
      decision:
        type: string
    required:
      - age
      - ECOG
      - main_diagnosis
      - secondary_diagnoses
      - predictive_factors
      - history
      - question
      - decision
    additionalProperties: false
